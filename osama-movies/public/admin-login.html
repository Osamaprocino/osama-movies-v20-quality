<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دخول الإدارة</title><link rel="stylesheet" href="/admin.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><script src="https://unpkg.com/lucide@latest"></script><script src="/icons-fallback.js"></script><link rel="stylesheet" href="/liquid.css">
<link rel="stylesheet" href="/admin-theme.css">
<script src="/admin-theme.js"></script>
</head>
<body class="auth-page"><main class="auth-card glass-admin"><div class="auth-mark"><i data-lucide="shield-check"></i></div><h1>لوحة الإدارة</h1><p>الدخول متاح للحساب الإداري فقط. لا توجد صفحة تحكم مكشوفة للزوار.</p><form id="login-form"><label>اسم المستخدم<input id="username" autocomplete="username" required></label><label>كلمة المرور<input id="password" type="password" autocomplete="current-password" minlength="8" required></label><button class="primary-admin" id="login-btn"><i data-lucide="log-in"></i><span>تسجيل الدخول</span></button><div id="login-error" class="error"></div></form><a href="/" class="back-link"><i data-lucide="arrow-right"></i> العودة للموقع</a></main><script>
lucide.createIcons();
document.getElementById('login-form').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('login-btn'),err=document.getElementById('login-error');b.disabled=true;err.textContent='';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value.trim(),password:password.value,otp:(document.getElementById('otp')||{}).value||undefined})});const d=await r.json();if(d.need_otp&&!document.getElementById('otp')){const i=document.createElement('input');i.id='otp';i.placeholder='رمز التحقق الثنائي (6 أرقام) أو رمز استرجاع';i.autocomplete='one-time-code';i.inputMode='numeric';i.dir='ltr';password.parentNode.appendChild(i);i.focus();}if(!r.ok)throw new Error(d.error||'تعذر تسجيل الدخول');location.href='/admin'}catch(x){err.textContent=x.message}finally{b.disabled=false}});
</script></body></html>
